# a summary about you
summary: "Imagine a food system which belongs entirely to the people growing, processing and consuming its products and which is designed not for profit but for permanence. Perhaps instead of maximising profits for shareholders its goal would be to build lasting relationships of trust and mutual care between rural and urban communities based on a shared responsibility for the future. Food would no longer be a commodity; the price of which is set by the ‘hidden hand’ of the market. It could perhaps become a symbol of mutual interdependence, valued for the labour required to produce it while caring for the lifeworlds of the nonhumans whose continuing flourishing is the ultimate source of our own survival. It might even plant the seeds of a wider social transformation towards a more sustainable and just world.
<br><br>
Is such a system possible? Has it ever been attempted in a modern industrialised country?
<br><br>
In South Korea there is a movement that has attempted just that. It is called the Hansalim Life Movement and it brings together a community of consumers and producers across Korea into a national cooperative federation which operates 240 stores serving roughly 1 million member households and supporting 2,300 producer households.
<br><br>
For the past five years, Dr Jonathan Dolley has been researching the Hansalim Life Movement -- first as a Marie Skłodowska-Curie Global Fellow and now as a visiting researcher at the [Mosim and Salim Research Institute](http://mosim.or.kr/) (Hansalim's research centre).
<br><br>
This project website is a home for the outputs from that research and a collection of resources about Hansalim that may be of interest for those outside Korea. It is a place to explore what lessons Hansalim's experience holds for those of us who are striving to transform our food systems away from industrialized models towards a fairer and more sustainable future."

