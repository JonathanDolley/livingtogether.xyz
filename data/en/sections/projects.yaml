# your projects
projects:
- name: The Hansalim Manifesto
  logo: /images/sections/skills/pagelines.svg
  role: "Hansalim"
  timeline: "2021"
  url: "https://book.livingtogether.xyz/files/HansalimManifestoEnglish2021.pdf"
  summary: "Written in 1989, the Hansalim Manifesto laid out the founders' critique of both capitalism and communism and their vision for an alternative civilization grounded in reverence for life and mutual care. For a commentary on the Manifesto, see my book project chapter 3."
  tags: ["books"]

- name: Book Project
  logo: /images/sections/skills/bowl-rice-solid.svg
  role: "Jonathan Dolley"
  timeline: "2024 - present"
  url: "https://book.livingtogether.xyz"
  summary: "*'Hansalim: The Universe in a Bowl of Rice.'* An online book published serially one chapter at a time, it presents the history and philosophy of Hansalim and describes its model of multi-stakeholder cooperation. Future chapters will showcase the personal stories of Hansalim members and explore the potential for others to learn from Hansalim's experience as they seek to build transformative food systems for a sustainable future"
  tags: ["books"]

- name: Hansalim 2026 Annual Report
  logo: /images/sections/projects/book-solid.svg
  role: "Hansalim"
  timeline: "2026"
  url: "files/Hansalim_Annual_Report_2026_EN.pdf"
  #url: ""
  summary: "This is the Hansalim Federation's annual report translated into English. It outlines the past year's activities and provides plenty of useful numbers to give you an idea of the scale of those activities."
  tags: ["reports"]

